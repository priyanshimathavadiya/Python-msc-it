
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - TO-DO List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="header-content">
        <h1>TO-DO List</h1>
        <p>Update your task details</p>
    </div>
</header>

<main class="container edit-container">

    <section class="panel">
        <p class="eyebrow">TASK #{{ task.id }}</p>
        <h2>Edit Task</h2>

        <form action="{{ url_for('update', id=task.id) }}"
              method="POST" class="task-form">

            <div class="form-field full-width">
                <label for="title">Task Title</label>
                <input type="text" id="title" name="title"
                       maxlength="150" value="{{ task.title }}" required>
            </div>

            <div class="form-field full-width">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          maxlength="300" rows="4">{{ task.description }}</textarea>
            </div>

            <div class="form-field">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                    <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                    <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                </select>
            </div>

            <div class="form-field">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date"
                       value="{{ task.due_date.isoformat() }}" required>
            </div>

            <div class="full-width form-actions">
                <button type="submit" class="button button-primary">
                    Save Changes
                </button>
                <a href="{{ url_for('home') }}" class="button button-light">
                    Cancel
                </a>
            </div>

        </form>
    </section>

</main>

<footer>Copyright © 2026 · TO-DO List</footer>

</body>
</html>
